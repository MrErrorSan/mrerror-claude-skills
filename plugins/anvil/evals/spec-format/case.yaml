schema_version: "1.1"
name: spec-format
description: |
  The spec Anvil writes is parseable. Run with --scaffold and --allow-tools Write Edit Bash.
  The request is detailed enough that few questions remain, and it names the topic slug so the
  graders know the path (docs/csv-export/spec.md).
expected_outcome: |
  The router sizes this full (a new feature) and brainstorm writes docs/csv-export/spec.md. The
  header carries "- **Approved:** no". Behaviors are S-lines in the pinned form
  "- **S1** ...", "- **S2** ...". At most three Waiting on you questions remain, each with a
  recommended answer. A builder check runs, `anvil present spec` is recorded, and the turn ends
  at stop 1 without planning or building.
context:
  scaffold_script: place-files.sh
